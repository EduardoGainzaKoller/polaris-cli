name: Feature request
description: An idea or improvement for Polaris.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or problem, before any solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Provider, project type, examples. No credentials, please.
