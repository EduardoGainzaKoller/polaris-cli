name: Bug report
description: Something in Polaris does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing Polaris! **Do not include API keys, tokens or other credentials** anywhere in this report.
  - type: input
    id: version
    attributes:
      label: Polaris version
      description: Output of `polaris --version`
      placeholder: Polaris 0.8.3
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Ubuntu 24.04 / macOS 15
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [codex, claude, anthropic-api, mock, not sure]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. cd into a project
        2. run `polaris`
        3. ask "..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead
      description: Error messages help a lot. Remove anything sensitive first.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: polaris doctor output
      description: Paste the output of `polaris doctor` (or attach the file from `polaris doctor --report`).
      render: text
    validations:
      required: true
